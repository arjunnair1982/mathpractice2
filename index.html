<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Quest ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --card: #1a1a2e;
    --card2: #16213e;
    --accent1: #ff6b9d;
    --accent2: #c77dff;
    --accent3: #48cae4;
    --accent4: #f9c74f;
    --accent5: #90be6d;
    --text: #fffffe;
    --subtext: #a7a9be;
    --correct: #90be6d;
    --wrong: #ef233c;
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 90%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 55%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 35%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 70%, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    padding: 24px 0 16px;
  }
  .header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8rem;
    background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }
  .header p {
    color: var(--subtext);
    font-size: 1rem;
    margin-top: 4px;
    font-weight: 600;
  }

  /* ── STREAK + XP BAR ── */
  .stats-row {
    display: flex;
    gap: 12px;
    margin: 16px 0;
    align-items: center;
  }
  .streak-badge {
    background: linear-gradient(135deg, #ff6b9d33, #ff6b9d11);
    border: 1.5px solid var(--accent1);
    border-radius: 50px;
    padding: 8px 18px;
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--accent1);
    white-space: nowrap;
  }
  .xp-container {
    flex: 1;
  }
  .xp-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--subtext);
    margin-bottom: 5px;
    font-weight: 700;
  }
  .xp-bar {
    height: 10px;
    background: #ffffff15;
    border-radius: 99px;
    overflow: hidden;
  }
  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent3));
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(.34,1.56,.64,1);
  }

  /* ── TOPIC TABS ── */
  .topic-tabs {
    display: flex;
    gap: 8px;
    margin: 20px 0 16px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .topic-tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: 50px;
    border: 1.5px solid transparent;
    background: var(--card2);
    color: var(--subtext);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab:hover { border-color: var(--accent2); color: var(--text); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: white;
    border-color: transparent;
  }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    border: 1px solid #ffffff10;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3));
  }

  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .q-topic-badge {
    font-size: 0.78rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 50px;
    background: #ffffff10;
    color: var(--accent3);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .q-number {
    font-size: 0.82rem;
    color: var(--subtext);
    font-weight: 700;
  }

  .q-scenario {
    background: #ffffff08;
    border-left: 3px solid var(--accent4);
    border-radius: 0 10px 10px 0;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 0.9rem;
    color: var(--subtext);
    line-height: 1.6;
    font-style: italic;
  }
  .q-scenario .emoji { font-style: normal; }

  .q-text {
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 22px;
    color: var(--text);
  }

  /* hint box */
  .hint-box {
    background: linear-gradient(135deg, #f9c74f15, #f9c74f08);
    border: 1px solid #f9c74f40;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 0.88rem;
    color: var(--accent4);
    font-weight: 600;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  .hint-box.show { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* answer input */
  .answer-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .answer-input {
    flex: 1;
    background: #ffffff0d;
    border: 2px solid #ffffff20;
    border-radius: 12px;
    padding: 13px 16px;
    color: var(--text);
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    outline: none;
    transition: border-color 0.2s;
  }
  .answer-input:focus { border-color: var(--accent2); }
  .answer-input.correct { border-color: var(--correct); background: #90be6d18; }
  .answer-input.wrong { border-color: var(--wrong); background: #ef233c18; }

  .btn {
    padding: 13px 22px;
    border-radius: 12px;
    border: none;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-submit {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: white;
  }
  .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-hint {
    background: #f9c74f20;
    color: var(--accent4);
    border: 1.5px solid #f9c74f40;
    font-size: 0.88rem;
    padding: 10px 14px;
  }
  .btn-next {
    background: linear-gradient(135deg, var(--accent3), var(--accent5));
    color: #0f0e17;
    width: 100%;
    margin-top: 14px;
    font-size: 1.05rem;
  }

  /* feedback */
  .feedback {
    margin-top: 16px;
    padding: 16px;
    border-radius: 12px;
    display: none;
    animation: slideIn 0.3s ease;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb {
    background: #90be6d18;
    border: 1.5px solid #90be6d50;
  }
  .feedback.wrong-fb {
    background: #ef233c12;
    border: 1.5px solid #ef233c40;
  }
  .feedback-title {
    font-weight: 800;
    font-size: 1rem;
    margin-bottom: 6px;
  }
  .feedback.correct-fb .feedback-title { color: var(--correct); }
  .feedback.wrong-fb .feedback-title { color: var(--wrong); }
  .feedback-explanation {
    font-size: 0.9rem;
    color: var(--subtext);
    line-height: 1.6;
  }
  .feedback-explanation strong { color: var(--text); }

  /* steps */
  .steps {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .step {
    font-size: 0.88rem;
    color: var(--subtext);
    padding: 4px 0;
    border-left: 2px solid var(--accent2);
    padding-left: 10px;
  }
  .step strong { color: var(--accent3); }

  /* ── PROGRESS ── */
  .session-progress {
    display: flex;
    gap: 6px;
    margin: 18px 0 0;
    justify-content: center;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ffffff15;
    transition: background 0.3s;
  }
  .dot.done { background: var(--correct); }
  .dot.active { background: var(--accent2); }
  .dot.wrong { background: var(--wrong); }

  /* ── CELEBRATION ── */
  .celebration {
    display: none;
    text-align: center;
    padding: 40px 20px;
    animation: slideIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .celebration.show { display: block; }
  .celebration .trophy { font-size: 5rem; margin-bottom: 16px; display: block; }
  .celebration h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.2rem;
    background: linear-gradient(135deg, var(--accent4), var(--accent1));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .celebration p { color: var(--subtext); font-size: 1rem; margin-top: 10px; font-weight: 600; }
  .score-display {
    font-family: 'Fredoka One', cursive;
    font-size: 3rem;
    color: var(--accent4);
    margin: 16px 0;
  }
  .btn-restart {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    color: white;
    margin-top: 20px;
    padding: 14px 32px;
    font-size: 1.1rem;
  }

  /* ── CONFETTI ── */
  .confetti-piece {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    pointer-events: none;
    animation: confettiFall linear forwards;
    z-index: 999;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* mobile tweaks */
  @media (max-width: 500px) {
    .header h1 { font-size: 2.1rem; }
    .q-text { font-size: 1rem; }
    .answer-row { flex-wrap: wrap; }
    .btn-hint { width: 100%; }
    .btn-submit { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- HEADER -->
  <div class="header">
    <h1>✨ Maths Quest</h1>
    <p>Level up your skills with real-world challenges!</p>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="streak-badge">🔥 <span id="streak">0</span> day streak</div>
    <div class="xp-container">
      <div class="xp-label">
        <span>⚡ XP</span>
        <span><span id="xp">0</span> / <span id="xp-next">100</span></span>
      </div>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- TOPIC TABS -->
  <div class="topic-tabs" id="topic-tabs">
    <button class="tab active" data-topic="all">🌟 All Topics</button>
    <button class="tab" data-topic="percentages">🎂 Percentages</button>
    <button class="tab" data-topic="ratio">🏀 Ratio</button>
    <button class="tab" data-topic="operations">🤸 Operations</button>
    <button class="tab" data-topic="division">🍪 Division</button>
  </div>

  <!-- PROGRESS DOTS -->
  <div class="session-progress" id="progress-dots"></div>

  <!-- QUESTION CARD -->
  <div id="game-area">
    <div class="question-card" id="question-card">
      <div class="q-meta">
        <span class="q-topic-badge" id="q-topic-badge">Percentages</span>
        <span class="q-number" id="q-number">Question 1 of 5</span>
      </div>

      <div class="q-scenario" id="q-scenario"></div>

      <div class="q-text" id="q-text"></div>

      <div class="hint-box" id="hint-box">💡 <span id="hint-text"></span></div>

      <div class="answer-row">
        <input type="text" class="answer-input" id="answer-input" placeholder="Type your answer…" />
        <button class="btn btn-hint" id="hint-btn">💡 Hint</button>
        <button class="btn btn-submit" id="submit-btn">Check ✓</button>
      </div>

      <div class="feedback" id="feedback">
        <div class="feedback-title" id="feedback-title"></div>
        <div class="feedback-explanation" id="feedback-explanation"></div>
        <div class="steps" id="feedback-steps"></div>
      </div>

      <button class="btn btn-next" id="next-btn" style="display:none">Next Challenge →</button>
    </div>
  </div>

  <!-- CELEBRATION SCREEN -->
  <div class="celebration" id="celebration">
    <span class="trophy">🏆</span>
    <h2>Session Complete!</h2>
    <div class="score-display" id="final-score"></div>
    <p id="celebration-msg"></p>
    <button class="btn btn-restart" onclick="restartGame()">Play Again 🎮</button>
  </div>

</div>

<script>
// ── ALL QUESTIONS ──
const allQuestions = [

  // ── PERCENTAGES ──
  {
    topic: "percentages",
    topicLabel: "🎂 Percentages",
    scenario: "🎂 You're baking your famous birthday cake for a friend. The recipe uses 200g of sugar, but you want to reduce the sugar by 10% to make it a little healthier.",
    question: "How many grams of sugar should you use instead?",
    hint: "10% means divide by 10. What is 200 ÷ 10? Then subtract that from 200.",
    answer: ["180", "180g", "180 g"],
    steps: [
      "10% of 200g = 200 ÷ 10 = <strong>20g</strong>",
      "Reduced amount = 200 − 20 = <strong>180g</strong>"
    ],
    explanation: "To find 10%, just divide by 10. Then subtract that from the original amount to get the new quantity."
  },
  {
    topic: "percentages",
    topicLabel: "🎂 Percentages",
    scenario: "🏀 Your basketball team won 20 games this season. 15% of those games were away games that you won despite a loud crowd.",
    question: "How many away games did you win?",
    hint: "1% of 20 = 20 ÷ 100 = 0.2. Then multiply by 15.",
    answer: ["3", "3 games"],
    steps: [
      "1% of 20 = 20 ÷ 100 = <strong>0.2</strong>",
      "15% of 20 = 0.2 × 15 = <strong>3 games</strong>"
    ],
    explanation: "Divide by 100 to get 1%, then multiply by the percentage you need. Here 15 × 0.2 = 3."
  },
  {
    topic: "percentages",
    topicLabel: "🎂 Percentages",
    scenario: "🎨 You're buying art supplies for your next big drawing project. A set of colouring pencils costs £40 and is on sale with 25% off.",
    question: "What is the sale price of the pencils?",
    hint: "Find 25% first: 10% + 10% + 5%. Then subtract from £40.",
    answer: ["30", "£30", "30 pounds"],
    steps: [
      "10% of £40 = <strong>£4</strong>",
      "25% = 10% + 10% + 5% = £4 + £4 + £2 = <strong>£10</strong>",
      "Sale price = £40 − £10 = <strong>£30</strong>"
    ],
    explanation: "Build 25% from 10% and 5%. Subtract the discount from the original price to find the sale price."
  },
  {
    topic: "percentages",
    topicLabel: "🎂 Percentages",
    scenario: "🤸 At gymnastics, your coach says you've improved your beam score by 20%. Your old score was 65 points.",
    question: "What is your new beam score?",
    hint: "Find 20% of 65 (= 10% × 2), then ADD it to 65 because you improved.",
    answer: ["78", "78 points"],
    steps: [
      "10% of 65 = <strong>6.5</strong>",
      "20% of 65 = 6.5 × 2 = <strong>13</strong>",
      "New score = 65 + 13 = <strong>78 points</strong>"
    ],
    explanation: "An improvement means we ADD the percentage. 20% of 65 is 13, so 65 + 13 = 78."
  },
  {
    topic: "percentages",
    topicLabel: "🎂 Percentages",
    scenario: "🤖 You're building an AI chatbot for a school project. Out of 200 test conversations, 35% gave a correct answer.",
    question: "How many conversations gave a correct answer?",
    hint: "Divide 200 by 100 to find 1%, then multiply by 35.",
    answer: ["70", "70 conversations"],
    steps: [
      "1% of 200 = 200 ÷ 100 = <strong>2</strong>",
      "35% of 200 = 2 × 35 = <strong>70 conversations</strong>"
    ],
    explanation: "Percent literally means 'per hundred'. Divide by 100 to get 1%, then scale up by multiplying."
  },
  {
    topic: "percentages",
    topicLabel: "🎂 Percentages",
    scenario: "🍪 You baked 80 cookies for a school fair. You sold 60% of them in the first hour.",
    question: "How many cookies did you sell in the first hour?",
    hint: "10% of 80 = 8. How can you build 60% from that?",
    answer: ["48", "48 cookies"],
    steps: [
      "10% of 80 = <strong>8</strong>",
      "60% = 10% × 6 = 8 × 6 = <strong>48 cookies</strong>"
    ],
    explanation: "60% is six lots of 10%. Since 10% of 80 is 8, multiply 8 by 6 to get 48."
  },

  // ── RATIO ──
  {
    topic: "ratio",
    topicLabel: "🏀 Ratio",
    scenario: "🍪 You're making chocolate chip cookies. The recipe uses flour and sugar in the ratio 3:1.",
    question: "If you use 240g of flour, how much sugar do you need?",
    hint: "In ratio 3:1, for every 3 parts flour there is 1 part sugar. If 3 parts = 240g, what is 1 part?",
    answer: ["80", "80g", "80 g"],
    steps: [
      "3 parts = 240g, so 1 part = 240 ÷ 3 = <strong>80g</strong>",
      "Sugar = 1 part = <strong>80g</strong>"
    ],
    explanation: "Ratio 3:1 means for every 3 parts flour, 1 part sugar. Divide flour by 3 to find one part, then sugar = 1 part."
  },
  {
    topic: "ratio",
    topicLabel: "🏀 Ratio",
    scenario: "🏀 In basketball training, your coach splits 35 students into shooting practice and dribbling drills in the ratio 3:4.",
    question: "How many students do shooting practice?",
    hint: "Add 3 + 4 to find total parts. Then divide 35 by that to find 1 part.",
    answer: ["15", "15 students"],
    steps: [
      "Total parts: 3 + 4 = <strong>7 parts</strong>",
      "One part = 35 ÷ 7 = <strong>5 students</strong>",
      "Shooting: 3 × 5 = <strong>15 students</strong>",
      "Check: 15 + 20 = 35 ✓"
    ],
    explanation: "Always: Add the ratio → find one part → multiply for each share. Check your answer by adding both shares."
  },
  {
    topic: "ratio",
    topicLabel: "🏀 Ratio",
    scenario: "🎨 You're mixing paint for your art project. You mix blue and yellow in the ratio 2:5 to make green.",
    question: "If you use 140ml of paint in total, how many ml of blue paint do you use?",
    hint: "Total parts = 2 + 5. Then find one part by dividing 140 by the total parts.",
    answer: ["40", "40ml", "40 ml"],
    steps: [
      "Total parts: 2 + 5 = <strong>7</strong>",
      "One part = 140 ÷ 7 = <strong>20ml</strong>",
      "Blue = 2 parts = 2 × 20 = <strong>40ml</strong>"
    ],
    explanation: "The ratio 2:5 means blue gets 2 parts and yellow gets 5 parts out of 7 total."
  },
  {
    topic: "ratio",
    topicLabel: "🏀 Ratio",
    scenario: "🤸 In gymnastics club, the ratio of flips to handstands practiced in a session is 3:7. The gymnasts do 50 skills in total.",
    question: "How many handstands do they practice?",
    hint: "Total parts = 3 + 7 = 10. One part = 50 ÷ 10.",
    answer: ["35", "35 handstands"],
    steps: [
      "Total parts: 3 + 7 = <strong>10</strong>",
      "One part = 50 ÷ 10 = <strong>5</strong>",
      "Handstands = 7 × 5 = <strong>35</strong>"
    ],
    explanation: "Handstands get 7 out of every 10 skills practiced. 7 × 5 = 35."
  },
  {
    topic: "ratio",
    topicLabel: "🏀 Ratio",
    scenario: "🤖 You and two friends are building an AI robot together. You split the coding time in the ratio 2:3:5.",
    question: "If the total coding time is 100 hours, how many hours do you (ratio share of 2) contribute?",
    hint: "Add all three parts: 2 + 3 + 5. Divide 100 by that to find 1 part.",
    answer: ["20", "20 hours"],
    steps: [
      "Total parts: 2 + 3 + 5 = <strong>10</strong>",
      "One part = 100 ÷ 10 = <strong>10 hours</strong>",
      "Your share = 2 × 10 = <strong>20 hours</strong>"
    ],
    explanation: "Three-way ratios work exactly the same — add all parts, find one part, then multiply for each person's share."
  },

  // ── ORDER OF OPERATIONS ──
  {
    topic: "operations",
    topicLabel: "🤸 Operations",
    scenario: "🎂 You're calculating how many cake slices you can serve. You have 3 cakes each cut into 8 slices, minus 4 slices eaten by helpers, then doubled for a party.",
    question: "Work out: (3 × 8 − 4) × 2",
    hint: "Remember BIDMAS: Brackets first, then multiply/divide left to right, then add/subtract.",
    answer: ["40"],
    steps: [
      "Brackets first: 3 × 8 = 24, then 24 − 4 = <strong>20</strong>",
      "Then: 20 × 2 = <strong>40 slices</strong>"
    ],
    explanation: "Always do what's inside brackets first. Then work through multiplication and subtraction in order."
  },
  {
    topic: "operations",
    topicLabel: "🤸 Operations",
    scenario: "🏀 Your basketball coach is calculating your point total. You scored 5 three-pointers and 4 two-pointers, then the opposing team subtracted 6 points as a penalty.",
    question: "Work out: 5 × 3 + 4 × 2 − 6",
    hint: "In BIDMAS, multiplication comes before addition and subtraction. Do all the multiplications first.",
    answer: ["17"],

  // ── LONG DIVISION ──

    steps: [
      "14 × 100 = 1400; remainder = 1848 − 1400 = 448",

    hint: "26 × 200 = 5200. Work from there. Express any remainder as remainder/26.",
    answer: ["225 1/13", "225 2/26", "225 1/13"],
    steps: [
      "26 × 200 = 5200; remainder = 652",
      "26 × 25 = 650; remainder = 2",

      "Remainder as fraction: 2/26 = <strong>1/13</strong>",

  }

// ── GAME STATE ──
let state = {
  questions: [],
  current: 0,
  score: 0,
  xp: 0,
  streak: parseInt(localStorage.getItem('streak') || '0'),
  lastPlayed: localStorage.getItem('lastPlayed') || '',
  hintUsed: false,
  answered: false,
  results: []
};

// Check/update streak
function checkStreak() {
  const today = new Date().toDateString();
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  if (state.lastPlayed === today) {
    // already played today, keep streak
  } else if (state.lastPlayed === yesterday) {
    state.streak++;
  } else if (state.lastPlayed !== today) {
    state.streak = 1;
  }
  state.lastPlayed = today;
  localStorage.setItem('streak', state.streak);
  localStorage.setItem('lastPlayed', today);
  document.getElementById('streak').textContent = state.streak;
}

// ── TOPIC FILTERING ──
let activeTopic = 'all';
document.getElementById('topic-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeTopic = tab.dataset.topic;
  startGame();
});

function getQuestions() {
  let pool = activeTopic === 'all' ? allQuestions : allQuestions.filter(q => q.topic === activeTopic);
  // Shuffle
  pool = [...pool].sort(() => Math.random() - 0.5);
  return pool.slice(0, Math.min(5, pool.length));
}

// ── START GAME ──
function startGame() {
  state.questions = getQuestions();
  state.current = 0;
  state.score = 0;
  state.results = [];
  document.getElementById('game-area').style.display = 'block';
  document.getElementById('celebration').classList.remove('show');
  buildDots();
  showQuestion();
}

function buildDots() {
  const container = document.getElementById('progress-dots');
  container.innerHTML = '';
  state.questions.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.id = `dot-${i}`;
    container.appendChild(dot);
  });
}

function showQuestion() {
  const q = state.questions[state.current];
  state.hintUsed = false;
  state.answered = false;

  document.getElementById('q-topic-badge').textContent = q.topicLabel;
  document.getElementById('q-number').textContent = `Question ${state.current + 1} of ${state.questions.length}`;
  document.getElementById('q-scenario').innerHTML = q.scenario;
  document.getElementById('q-text').textContent = q.question;
  document.getElementById('hint-text').textContent = q.hint;
  document.getElementById('hint-box').classList.remove('show');

  const input = document.getElementById('answer-input');
  input.value = '';
  input.className = 'answer-input';
  input.disabled = false;
  input.focus();

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('submit-btn').style.display = 'inline-block';
  document.getElementById('hint-btn').style.display = 'inline-block';

  // Re-animate card
  const card = document.getElementById('question-card');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = '';
}

// ── HINT ──
document.getElementById('hint-btn').addEventListener('click', () => {
  state.hintUsed = true;
  document.getElementById('hint-box').classList.add('show');
});

// ── SUBMIT ──
document.getElementById('submit-btn').addEventListener('click', checkAnswer);
document.getElementById('answer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !state.answered) checkAnswer();
});

function normalise(str) {
  return str.toLowerCase().replace(/[£\s,]/g, '').trim();
}

function checkAnswer() {
  if (state.answered) return;
  const q = state.questions[state.current];
  const raw = document.getElementById('answer-input').value.trim();
  if (!raw) return;

  const userNorm = normalise(raw);
  const correct = q.answer.some(a => normalise(a) === userNorm);

  state.answered = true;
  document.getElementById('answer-input').disabled = true;
  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('hint-btn').style.display = 'none';

  const fb = document.getElementById('feedback');
  const input = document.getElementById('answer-input');

  if (correct) {
    input.classList.add('correct');
    fb.className = 'feedback correct-fb show';
    document.getElementById('feedback-title').textContent = '🎉 Brilliant! That\'s correct!';

    const xpGain = state.hintUsed ? 5 : 10;
    state.score++;
    state.xp += xpGain;
    state.results.push('correct');
    document.getElementById(`dot-${state.current}`).classList.remove('active');
    document.getElementById(`dot-${state.current}`).classList.add('done');

    document.getElementById('feedback-explanation').innerHTML = q.explanation;
    const stepsEl = document.getElementById('feedback-steps');
    stepsEl.innerHTML = '';

  } else {
    input.classList.add('wrong');
    fb.className = 'feedback wrong-fb show';
    document.getElementById('feedback-title').textContent = `❌ Not quite — the answer is ${q.answer[0]}`;
    state.results.push('wrong');
    document.getElementById(`dot-${state.current}`).classList.remove('active');
    document.getElementById(`dot-${state.current}`).classList.add('wrong');

    document.getElementById('feedback-explanation').innerHTML = q.explanation;
    const stepsEl = document.getElementById('feedback-steps');
    stepsEl.innerHTML = '<br><strong style="color:var(--accent3)">Working it out step by step:</strong>';
    q.steps.forEach(s => {
      const div = document.createElement('div');
      div.className = 'step';
      div.innerHTML = s;
      stepsEl.appendChild(div);
    });
  }

  updateXP();

  if (state.current + 1 < state.questions.length) {
    if (state.current + 1 < state.questions.length) {
      const nextDot = document.getElementById(`dot-${state.current + 1}`);
      if (nextDot) nextDot.classList.add('active');
    }
    document.getElementById('next-btn').style.display = 'block';
  } else {
    setTimeout(() => showCelebration(), 800);
  }
}

document.getElementById('next-btn').addEventListener('click', () => {
  state.current++;
  showQuestion();
});

// ── XP UPDATE ──
function updateXP() {
  const xpMax = 100;
  document.getElementById('xp').textContent = state.xp;
  const pct = Math.min((state.xp / xpMax) * 100, 100);
  document.getElementById('xp-fill').style.width = pct + '%';
}

// ── CELEBRATION ──
function showCelebration() {
  document.getElementById('game-area').style.display = 'none';
  const cel = document.getElementById('celebration');
  cel.classList.add('show');

  const total = state.questions.length;
  const score = state.score;
  document.getElementById('final-score').textContent = `${score} / ${total}`;

  let msg = '';
  if (score === total) msg = "Perfect score! You're a maths superstar! 🌟";
  else if (score >= total * 0.8) msg = "Amazing work — nearly there! Keep practising! 💪";
  else if (score >= total * 0.6) msg = "Good effort! Go back and read the working out for the ones you missed. 📚";
  else msg = "Keep going — every session makes you stronger! 🚀";
  document.getElementById('celebration-msg').textContent = msg;

  if (score >= Math.ceil(total * 0.6)) launchConfetti();
}

function restartGame() {
  document.getElementById('celebration').classList.remove('show');
  startGame();
}

// ── CONFETTI ──
function launchConfetti() {
  const colors = ['#ff6b9d','#c77dff','#48cae4','#f9c74f','#90be6d'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      el.style.animationDelay = '0s';
      el.style.width = (6 + Math.random() * 8) + 'px';
      el.style.height = (6 + Math.random() * 8) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 40);
  }
}

// ── INIT ──
checkStreak();
startGame();
</script>
